[package]
name = "omp-xfs"
version = "19.0.1"
edition = "2024"
license = "MIT"
authors = ["Stencil Labs, Inc."]
description = "Extended filesystem: parallel walking, globbing, content search, and change notification. Vendored from can1357/oh-my-pi (MIT), see ../LICENSE-oh-my-pi."
homepage = "https://omp.sh/"
repository = "https://github.com/can1357/oh-my-pi"

[dependencies]
flume = "0.11"
futures.workspace = true
grep-matcher.workspace = true
grep-pcre2.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
hashbrown = { version = "0.17.1", features = ["default-hasher"] }
memchr = "2"
omp-vfs = { package = "pi-vfs", path = "../pi-vfs" }
parking_lot.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
async-trait = "0.1"
globset = "0.4"
ignore = "0.4"
tempfile = "3"

[lints]
