[package]
name = "xutf"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["oh-my-tau contributors"]
description = "Pure stable-Rust stand-in for the xutf APIs the vendored omp2 shell stack consumes"

[dependencies]
unicode-normalization = "0.1"
# UCD 16.0.0 tables, pinned: see src/ucd.rs.
unicode-properties = { version = "=0.1.3", default-features = false, features = ["general-category"] }
unicode-script = "=0.5.7"
unicode-segmentation = "1"
unicode-width = "0.2"

[lints]
workspace = true
