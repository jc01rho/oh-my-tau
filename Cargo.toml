[workspace]
resolver = "2"
members = [
    "vendor/pa-types",
    "vendor/pa-ai",
    "vendor/pa-models",
    "vendor/pa-agent",
    "vendor/pi-edit",
    "vendor/pi-ast",
    "vendor/pi-diff",
    "vendor/pi-vfs",
    "vendor/pi-predict",
    "vendor/omp-xfs",
    "vendor/omp-utok",
    # oh-my-pi (omp2) shell stack, vendored verbatim from the pinned omp2 commit
    # (see vendor-src.lock). vendor/omp-proto is deliberately absent: it ships its
    # own `[workspace]` table and reaches the graph as a path dependency instead,
    # because a member that is also a workspace root is a hard cargo error.
    "vendor/omp-core",
    "vendor/omp-macros",
    "vendor/omp-vocab",
    "vendor/omp-walker",
    "vendor/omp-tool",
    "vendor/omp-shell",
    "vendor/omp-shell-builtins",
    "vendor/laya-ort",
    "vendor/xutf",
    "crates/*",
]
# ws_ckpt checkpoint stores (not crates).
#
# vendor/omp-proto keeps its upstream `[workspace]` table (it is a shim that must
# stay standalone), and cargo hard-errors with "multiple workspace roots found"
# unless the enclosing workspace excludes it. Verified with a minimal repro.
# So it is a plain path dependency via [workspace.dependencies], never a member.
exclude = ["crates/.wsckpt", "vendor/omp-proto"]

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
# preserve_order: serde_json::Map keeps insertion order (IndexMap) so every
# wire/durable JSON surface serializes in construction order — the JS object
# model the TS daemon and session files byte-emit. Without it the Map is a
# BTreeMap and every Value-built frame re-sorts its keys alphabetically,
# diverging from the TS byte stream (e.g. compaction `details` order).
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = { version = "0.1", features = ["attributes"] }
pa-types = { path = "vendor/pa-types" }
pa-ai = { path = "vendor/pa-ai" }
pa-agent = { path = "vendor/pa-agent" }
thiserror = "2"
futures = "0.3"

# ──────────────────────────────────────────────────────────────────────────────
# Vendored oh-my-pi (omp2) shell stack
#
# Versions and feature unions are copied verbatim from the upstream omp2
# workspace manifest at commit 2f92f3b5aa2035d21c9f016f9ff6350795e5685a
# (vendor-src.lock), because the vendored manifests only ever say
# `dep.workspace = true`. Path crates carry no version requirement, matching
# this workspace's existing vendor/* style (deny.toml allow-wildcard-paths).
# ──────────────────────────────────────────────────────────────────────────────
omp-core = { path = "vendor/omp-core", features = ["schemars"] }
omp-macros = { path = "vendor/omp-macros" }
omp-vocab = { path = "vendor/omp-vocab" }
omp-walker = { path = "vendor/omp-walker" }
omp-xfs = { path = "vendor/omp-xfs" }
omp-utok = { path = "vendor/omp-utok" }
omp-tool = { path = "vendor/omp-tool" }
omp-proto = { path = "vendor/omp-proto" }
omp-shell = { path = "vendor/omp-shell" }
omp-shell-builtins = { path = "vendor/omp-shell-builtins" }

argmax = "0.3"
async-recursion = "1.1"
bigdecimal = "0.4"
blake2 = "0.10"
blake3 = { version = "1.8" }
bon = "3"
bstr = "1"
bytecount = { version = "0.6", features = ["runtime-dispatch-simd"] }
bytes = { version = "1.12.1", features = ["serde"] }
bytes-utils = { version = "0.1.4", features = ["serde"] }
cfg-if = "1"
chrono = "0.4.45"
clap = { version = "4", features = ["derive", "wrap_help"] }
codesnake = "0.2"
command-fds = "0.3"
crc32fast = "1.5"
dashmap = "6"
digest = "0.10"
fancy-regex = "0.17"
flume = "0.11"
foldhash = "0.2"
futures-core = "0.3"
globset = "0.4"
grep-cli = "0.1"
grep-matcher = "0.1"
grep-pcre2 = "0.1"
grep-printer = "0.3"
grep-regex = "0.1"
grep-searcher = "0.1"
heapless = { version = "0.9.3", features = ["serde"] }
hifijson = "0.2"
ignore = "0.4"
im = { version = "15.1", features = ["serde"] }
indicatif = "0.18"
insta = { version = "1.47", features = ["glob", "ron", "redactions"] }
itertools = "0.14"
jaq-core = "2.1"
jaq-json = "1.1"
jaq-std = "2.1"
