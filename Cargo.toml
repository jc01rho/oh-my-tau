notify = { version = "=8.2.0", features = ["macos_kqueue"] }
num-bigint = "0.4"
num-traits = "0.2"
parking_lot = "0.12"
parking_lot_core = "0.9.12"
parse_datetime = "0.14"
peg = "0.8"
postcard = { version = "1.1.3", features = ["alloc"] }
pretty_assertions = { version = "1", features = ["unstable"] }
proc-macro2 = "1"
proptest = "1.11.0"
quote = "1"
rand = { version = "0.10", features = ["std_rng"] }
rayon = "1.10"
regex = "1.11"
rustix = { version = "1.1", features = ["fs", "pipe", "process", "time"] }
schemars = "1.2.2"
self_cell = "1"
sha1 = "0.10"
sha2 = "0.10"
