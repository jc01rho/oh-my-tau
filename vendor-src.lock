# vendor-src.lock - pins the upstream sources the vendored trees were copied from.
# Regenerate by re-copying vendor/ from the pinned revisions below; do not edit vendor/
# by hand without updating this file in the same change.
lockfile-version = 1

[upstream."can1357/oh-my-pi"]
repo = "https://github.com/can1357/oh-my-pi"
ref = "main"
# Full 40-hex SHA of the upstream main inspected for the migration baseline
# (v19.0.1+126). Vendored pi-* crates below were imported earlier at crate
# versions 18.6.1 / 18.9.1 (exact import commit SHA unrecorded at initial import).
reference-commit = "b636e19d10b664950d600505d194337bbeef42f0"
# This file is a pin ledger only (provenance record for the vendored trees); no
# script reads it. The TS oracle/porting scripts resolve their oh-my-pi checkout
# from $OMP_TS_SRC, else <repo>/vendor-src/oh-my-pi, which is where oracle-path
# points (gitignored, not distributed).
oracle-path = "vendor-src/oh-my-pi"
license = "MIT"
license-file = "vendor/LICENSE-oh-my-pi"

[upstream.omp2]
repo = "https://github.com/can1357/oh-my-pi"
ref = "omp2"
reference-commit = "2f92f3b5aa2035d21c9f016f9ff6350795e5685a"
license = "MIT"
license-file = "vendor/LICENSE-oh-my-pi"

[crates.pi-ast]
path = "vendor/pi-ast"
version = "19.0.1"
source = "can1357/oh-my-pi (main, crates/ast)"
import-commit = "b636e19d10b664950d600505d194337bbeef42f0"
reference-commit = "b636e19d10b664950d600505d194337bbeef42f0"
modifications = "manifest keeps crate name pi-ast, omits default wasm feature/wasmtime edge (wasm = [\"dep:semver\"]), gates two upstream grammar tests requiring unvendored tree-sitter-go patch / tree-sitter-md 0.5.4 / extra dev grammars behind opt-in features (`patched-tree-sitter-go`, `test-grammars`), drops `[lints] workspace = true`, and formats with workspace default rustfmt"

[crates.pi-diff]
path = "vendor/pi-diff"
version = "19.0.1"
source = "can1357/oh-my-pi (main, crates/diff)"
import-commit = "b636e19d10b664950d600505d194337bbeef42f0"
reference-commit = "b636e19d10b664950d600505d194337bbeef42f0"
modifications = "manifest keeps crate name pi-diff, links path xutf shim, omits `[lints] workspace = true`, and formats with workspace default rustfmt"

[crates.pi-edit]
path = "vendor/pi-edit"
version = "19.0.1"
source = "can1357/oh-my-pi (main, crates/edit)"
import-commit = "b636e19d10b664950d600505d194337bbeef42f0"
reference-commit = "b636e19d10b664950d600505d194337bbeef42f0"
modifications = "manifest keeps crate name pi-edit with package aliases omp-ast/omp-diff -> pi-ast/pi-diff, omits `[lints] workspace = true`, adds `#[allow(clippy::too_many_arguments)]` on 6 upstream internal helpers, skips the single `.lua` fixture case in `tests/hashline_parity.rs` requiring unvendored `tree-sitter-lua`, and formats with workspace default rustfmt"

[crates.pi-vfs]
path = "vendor/pi-vfs"
version = "19.0.1"
source = "can1357/oh-my-pi (main, crates/vfs)"
import-commit = "b636e19d10b664950d600505d194337bbeef42f0"
reference-commit = "b636e19d10b664950d600505d194337bbeef42f0"
modifications = "manifest keeps crate name pi-vfs, omits `[lints] workspace = true` (46 unsafe blocks incompatible with workspace unsafe_code=forbid), and formats with workspace default rustfmt"

[crates.omp-xfs]
path = "vendor/omp-xfs"
version = "19.0.1"
source = "can1357/oh-my-pi (main, crates/xfs)"
import-commit = "b636e19d10b664950d600505d194337bbeef42f0"
reference-commit = "b636e19d10b664950d600505d194337bbeef42f0"
modifications = "replaces retired pi-walker; manifest uses flume 0.11, omp-vfs -> pi-vfs package alias, bare `[lints]` (unsafe blocks), `grep/render.rs` uses `.chars().count()` for UTF-32 column count, watch doc example tabs converted to spaces, and formatted with workspace default rustfmt"

[crates.pi-predict]
path = "vendor/pi-predict"
version = "19.0.1"
source = "can1357/oh-my-pi (main, crates/predict, ngram only)"
import-commit = "b636e19d10b664950d600505d194337bbeef42f0"
reference-commit = "b636e19d10b664950d600505d194337bbeef42f0"
modifications = "ngram-only subset (no src/smollm, src/apple, or macOS candle/objc2 deps; `Method::{SmolLm,Apple}` return explicit fallback errors), keeps zstd 0.13 and `[lints.cargo] unused_dependencies = \"allow\"`, uses std `encode_utf16`/`split_inclusive` in `prose.rs`/`ngram/web.rs`, and formats with workspace default rustfmt"

# ── omp2 shell stack ──────────────────────────────────────────────────────────
# Vendored verbatim from can1357/oh-my-pi ref `omp2`. The upstream workspace
# manifest supplies the dependency versions these crates only reference as
# `dep.workspace = true`; they are mirrored into this repo's
# [workspace.dependencies] (see the "Vendored oh-my-pi (omp2) shell stack"
# block in Cargo.toml). Keep the two in step when re-pinning.

[crates.omp-core]
path = "vendor/omp-core"
version = "0.1.0"
source = "can1357/oh-my-pi (omp2, crates/core)"
reference-commit = "2f92f3b5aa2035d21c9f016f9ff6350795e5685a"
license = "MIT"
license-file = "vendor/LICENSE-oh-my-pi"
modifications = "manifest only, both required to build outside the upstream workspace: edition pinned to 2024 (upstream inherits it; the crate uses let-chains, which are 2024-only, while this workspace stays on edition 2021) and upstream's `[lints] workspace = true` dropped (it would import this workspace's `unsafe_code = forbid`, but omp-core contains real unsafe blocks). Source is verbatim."

[crates.omp-macros]
path = "vendor/omp-macros"
version = "0.1.0"
source = "can1357/oh-my-pi (omp2, crates/macros)"
reference-commit = "2f92f3b5aa2035d21c9f016f9ff6350795e5685a"
license = "MIT"
license-file = "vendor/LICENSE-oh-my-pi"
modifications = "manifest: version/edition/license/authors pinned literally so the crate builds outside the upstream workspace"

[crates.omp-vocab]
path = "vendor/omp-vocab"
version = "0.1.0"
source = "can1357/oh-my-pi (omp2, crates/vocab)"
reference-commit = "2f92f3b5aa2035d21c9f016f9ff6350795e5685a"
license = "MIT"
license-file = "vendor/LICENSE-oh-my-pi"
modifications = "manifest: version/edition/license/authors pinned literally"

[crates.omp-walker]
path = "vendor/omp-walker"
version = "0.1.0"
source = "can1357/oh-my-pi (omp2, crates/walker)"
reference-commit = "2f92f3b5aa2035d21c9f016f9ff6350795e5685a"
license = "MIT"
license-file = "vendor/LICENSE-oh-my-pi"
modifications = "manifest: version/edition/license/authors pinned literally"

[crates.omp-shell]
path = "vendor/omp-shell"
version = "0.1.0"
source = "can1357/oh-my-pi (omp2, crates/shell)"
reference-commit = "2f92f3b5aa2035d21c9f016f9ff6350795e5685a"
license = "MIT"
license-file = "vendor/LICENSE-oh-my-pi"
modifications = "manifest: version/edition/license/authors pinned literally; src/sys/hostname.rs moves GetComputerNameW import from SystemInformation to WindowsProgramming for windows-sys 0.61 compatibility"

[crates.omp-shell-builtins]
path = "vendor/omp-shell-builtins"
version = "0.1.0"
source = "can1357/oh-my-pi (omp2, crates/shell-builtins)"
reference-commit = "2f92f3b5aa2035d21c9f016f9ff6350795e5685a"
license = "MIT"
license-file = "vendor/LICENSE-oh-my-pi"
modifications = "manifest: version/edition/license/authors pinned literally; src/{hostname,ls,uname}.rs move GetComputerNameW import from SystemInformation to WindowsProgramming for windows-sys 0.61 compatibility"

[crates.xutf]
path = "vendor/xutf"
version = "0.1.0"
source = "first-party shim (not vendored): stable-Rust replacement for crates.io xutf"
reference-commit = "n/a"
license = "MIT"
modifications = "replaces xutf 2.3.0 (and earlier 1.6.0), which requires nightly (core::simd) and a generated Unicode property trie. Covers the surface consumed by the omp2 shell stack (BufReadCharsExt/Chars/CharsRaw/ReadCharError, strip_ansi, width_char/width_str/width_ansi_str) and the Phase 2.5 19.0.1 stack (Encoding/Unit/Utf8/Utf16, Text::transcoded_len/unit_offset, LineEnds/lines/lines_str/Line::with_end, UnitSet, find_iter, IntoUnicodeNormalized::into_nfc via unicode-normalization)"

# Local shims, not upstream code. Recorded here because they occupy the omp-*
# crate names the rest of the tree imports.
[crates.omp-tool]
path = "vendor/omp-tool"
version = "0.1.0"
source = "first-party shim (not vendored): harness diagnostics only"
reference-commit = "n/a"
license = "MIT"
modifications = "replaces upstream crates/tool, which pulls omp-ai/omp-catalog/omp-proto gRPC and the whole agent mesh; only the Diag surface omp-shell-builtins consumes is present"

[crates.omp-proto]
path = "vendor/omp-proto"
version = "0.1.0"
source = "first-party shim (not vendored): hand-written wire shapes"
reference-commit = "n/a"
license = "MIT"
modifications = "replaces upstream crates/proto (prost/protox build-script gRPC codegen) with dependency-free Rust types; declares its own [workspace] so it is a path dependency, not a member"

[deps.crossterm]
