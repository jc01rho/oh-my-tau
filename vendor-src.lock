# vendor-src.lock - pins the upstream sources the vendored trees were copied from.
# Regenerate by re-copying vendor/ from the pinned revisions below; do not edit vendor/
# by hand without updating this file in the same change.
lockfile-version = 1

[upstream."can1357/oh-my-pi"]
repo = "https://github.com/can1357/oh-my-pi"
ref = "main"
# Latest upstream main inspected for migration baseline (v19.0.1+126).
# Vendored pi-* crates below were imported earlier at crate versions 18.6.1 / 18.9.1
# (exact import commit SHA unrecorded at initial import).
reference-commit = "b636e19d10"
# TS oracle sources (scripts/compat-oracle/*) default to <repo>/vendor-src/oh-my-pi
# or the checkout named by $OMP_TS_SRC.
oracle-path = "vendor-src/oh-my-pi"
license = "MIT"
license-file = "vendor/LICENSE-oh-my-pi"

[upstream.omp2]
repo = "https://github.com/can1357/oh-my-pi"
ref = "omp2"
reference-commit = "2f92f3b"
license = "MIT"
license-file = "vendor/LICENSE-oh-my-pi"

[crates.pi-ast]
path = "vendor/pi-ast"
version = "18.9.1"
source = "can1357/oh-my-pi (main, crates/ast)"
import-commit = "unrecorded (v18.9.1)"
reference-commit = "b636e19d10"

[crates.pi-diff]
path = "vendor/pi-diff"
version = "18.9.1"
source = "can1357/oh-my-pi (main, crates/diff)"
import-commit = "unrecorded (v18.9.1)"
reference-commit = "b636e19d10"

[crates.pi-edit]
path = "vendor/pi-edit"
version = "18.9.1"
source = "can1357/oh-my-pi (main, crates/edit)"
import-commit = "unrecorded (v18.9.1)"
reference-commit = "b636e19d10"

[crates.pi-vfs]
path = "vendor/pi-vfs"
version = "18.9.1"
source = "can1357/oh-my-pi (main, crates/vfs)"
import-commit = "unrecorded (v18.9.1)"
reference-commit = "b636e19d10"

[crates.pi-walker]
path = "vendor/pi-walker"
version = "18.9.1"
source = "can1357/oh-my-pi (main, crates/walker -> retired into crates/xfs)"
import-commit = "unrecorded (v18.9.1)"
reference-commit = "b636e19d10"

[crates.pi-predict]
path = "vendor/pi-predict"
version = "18.6.1"
source = "can1357/oh-my-pi (main, crates/predict, ngram only)"
import-commit = "unrecorded (v18.6.1)"
reference-commit = "b636e19d10"

[deps.crossterm]
# Patched crossterm vendored under vendor/crossterm (upstream crate version 0.28.1).
path = "vendor/crossterm"
version = "0.28.1"
repo = "https://github.com/crossterm-rs/crossterm"
sha = "492b764f9f132d302903ff6f2f55e96c1b8cd0ec"
license = "MIT"
