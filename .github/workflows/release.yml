name: Release

on:
  push:
    tags: ["v*"]
  # Re-run the build for an existing tag (binaries are built from the tag's source).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build, e.g. v0.11.0"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Keep build-machine paths (cargo registry, toolchain, checkout) out of the
  # binaries; mirrors scripts/release.sh.
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc builds need glibc >= the build host's. The prebuilt ONNX Runtime needs
          # glibc >= 2.38, so 24.04 (2.39) is the oldest usable runner; ubuntu-latest
          # produced binaries needing GLIBC_2.43. Older systems get the musl build.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            asset: omt-linux-x64
            tarball: omt-linux-x64.tar.gz
            bin: omt
            strip: objcopy
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: omt-linux-arm64
            tarball: omt-linux-arm64.tar.gz
            bin: omt
            strip: objcopy
          # Fully static Linux builds (any distro, incl. Alpine); no ONNX Runtime.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset: omt-linux-x64-musl
            tarball: omt-linux-x64-musl.tar.gz
            bin: omt
            strip: copy
            musl: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset: omt-linux-arm64-musl
            tarball: omt-linux-arm64-musl.tar.gz
            bin: omt
            strip: copy
            musl: true
          - target: x86_64-apple-darwin
            # Intel runners are retired; cross-compile on Apple silicon. macos-14 is retired
            # too ("configuration 'macos-14-arm64-us-default' is not supported", v0.13.0).
            runner: macos-latest
            asset: omt-macos-x64
            tarball: omt-macos-x64.tar.gz
            bin: omt
            strip: strip
            # No prebuilt ONNX Runtime for Intel macOS: build without the Laya ONNX heads.
            cargo_args: --no-default-features
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: omt-macos-arm64
            tarball: omt-macos-arm64.tar.gz
            bin: omt
            strip: strip
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: omt-windows-x64.exe
            tarball: omt-windows-x64.tar.gz
            bin: omt.exe
            strip: none
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The prebuilt onnxruntime (ort) calls `__isPlatformVersionAtLeast`, which
      # lives in clang's compiler-rt; rustc links with -nodefaultlibs, so add it.
      - name: macOS compiler-rt
        if: runner.os == 'macOS'
        shell: sh
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=13.4" >> "$GITHUB_ENV"
          echo "OMT_MAC_LINK=-C link-arg=$(xcrun clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a" >> "$GITHUB_ENV"
      # Build and packaging tooling from the workflow's commit (fixes apply to re-runs of older tags).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _wf
          sparse-checkout: scripts
      - uses: mlugg/setup-zig@v1
        if: matrix.musl
        with:
          version: 0.13.0
      - name: Build (musl, static)
        if: matrix.musl
        shell: sh
        run: |
          reg="${CARGO_HOME:-$HOME/.cargo}/registry/src"
          OMT_EXTRA_RUSTFLAGS="-C strip=debuginfo --remap-path-prefix=${reg}=/cargo/registry/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}/git/checkouts=/cargo/git --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup --remap-path-prefix=$(pwd)=/omt" \
            _wf/scripts/build-musl.sh "$(echo ${{ matrix.target }} | cut -d- -f1)"
          file "target/${{ matrix.target }}/release/omt" | grep -q "statically linked"
          "target/${{ matrix.target }}/release/omt" --version
      - name: Build
        if: ${{ !matrix.musl }}
        shell: sh
        run: |
          reg="${CARGO_HOME:-$HOME/.cargo}/registry/src"
          RUSTFLAGS="${OMT_MAC_LINK:-} --remap-path-prefix=${reg}=/cargo/registry/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}/git/checkouts=/cargo/git --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup --remap-path-prefix=$(pwd)=/omt" \
            cargo build --release --target ${{ matrix.target }} -p omp-cli ${{ matrix.cargo_args }}
      - name: Package
        shell: sh
        run: |
          mkdir -p dist out
          case "${{ matrix.strip }}" in
            copy)    cp "target/${{ matrix.target }}/release/omt" "out/${{ matrix.bin }}" ;;
            objcopy) objcopy --strip-debug "target/${{ matrix.target }}/release/omt" "out/${{ matrix.bin }}" ;;
            strip)   cp "target/${{ matrix.target }}/release/omt" "out/${{ matrix.bin }}" && strip "out/${{ matrix.bin }}" ;;
            *)       cp "target/${{ matrix.target }}/release/omt.exe" "out/${{ matrix.bin }}" ;;
          esac
          chmod +x "out/${{ matrix.bin }}"
          # The bare binary stays for scripts that download it directly; it cannot run
          # extensions on its own, so the tarball is the artifact install.sh uses.
          cp "out/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
          sh _wf/scripts/package-release.sh "out/${{ matrix.bin }}" "dist/${{ matrix.tarball }}" "${{ matrix.bin }}" .
          # sha256sum is absent on the macOS runners and shasum on the Windows
          # ones, so pick whichever the runner provides.
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.tarball }}" > "${{ matrix.tarball }}.sha256"
          else
            shasum -a 256 "${{ matrix.tarball }}" > "${{ matrix.tarball }}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.tarball }}
            dist/${{ matrix.tarball }}.sha256

  release:
    needs: build
    # Publish whatever built: one unsupported target must not block the rest.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: |
            LICENSE
            NOTICE.md
            vendor/LICENSE-oh-my-pi
            vendor/omp-utok/data/LICENSE.ctok
            vendor/omp-utok/data/LICENSE-Qwen.Apache-2.0
          sparse-checkout-cone-mode: false
      - name: Third-party notices
        # The binary embeds third-party tokenizer data (omp-utok); Apache-2.0
        # (Qwen) and MIT require their license texts to travel with it.
        run: |
          {
            for f in LICENSE NOTICE.md vendor/LICENSE-oh-my-pi vendor/omp-utok/data/LICENSE.ctok vendor/omp-utok/data/LICENSE-Qwen.Apache-2.0; do
              printf '==== %s ====\n\n' "$f"
              cat "src/$f"
              printf '\n\n'
            done
          } > dist/THIRD-PARTY-NOTICES.txt
      - name: Checksums
        run: |
          cd dist
          # Per-tarball .sha256 files exist already; the combined list covers the
          # assets themselves so `install.sh` can verify either shape.
          sha256sum $(ls omt-* | grep -v '\.sha256$') > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${RELEASE_TAG}" --repo "${{ github.repository }}" --title "omt ${RELEASE_TAG}" --generate-notes
          gh release upload "${RELEASE_TAG}" dist/* --repo "${{ github.repository }}" --clobber
