[package]
name = "omp-dap"
description = "DAP (Debug Adapter Protocol) machinery for omp-rs: adapter discovery/config, stdio/socket/tcp client, session manager and formatters (port of omp src/dap)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = "2"
tracing = { workspace = true }
base64 = "0.22"
parking_lot = "0.12"
# YAML config files (`dap.yaml`/`dap.yml`) need a YAML parser; `serde_yaml`
# 0.9.34 is already in Cargo.lock (omp-lsp depends on it), so this adds no new
# package to the graph and keeps TS `parseConfigContent` parity.
serde_yaml = "0.9.34"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
